name: Deploy Sanctions Screening - PROD

on:
  push:
    branches:
      - prod

concurrency:
  group: sanctions-prod-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to PROD EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to PROD EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "======================================"
            echo "Sanctions PROD Deployment"
            echo "======================================"

            cd /var/www/html/AML

            echo "Fetching latest code..."
            git fetch origin

            echo "Checking out prod..."
            git checkout prod

            echo "Updating to origin/prod..."
            git reset --hard origin/prod

            echo "Deployed commit:"
            git rev-parse --short HEAD

            echo "Building Docker image..."
            docker compose build sanctions

            echo "Starting sanctions service..."
            docker compose up -d sanctions

            echo "Waiting for application..."
            sleep 10

            echo "Container status:"
            docker compose ps sanctions

            echo "Health check..."
            curl --fail http://127.0.0.1:3011/healthz

            echo "======================================"
            echo "PROD Deployment successful"
            echo "======================================"
